<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>some products</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1 class="page-title">Выбери свой продукт</h1>

  <ul class="products-list" id="products-list"></ul>

  <template id="card-template">
    <li class="card">
      <img class="card__image" src="" alt="">
      <p class="card__skin-type card__skin-type--normal"></p>
      <h2 class="card__title"></h2>
      <p class="card__description"></p>
      <span class="card__subtitle">Состав:</span>
      <ul class="card__list"></ul>
      <div class="card__price-line">
        <span class="card__price-label">Цена</span>
        <span class="card__price-value"></span>
      </div>
    </li>
  </template>

  <footer class="footer">
  <div class="footer__brand">
    <h3>Product Cards</h3>
    <p>У Нас Самые Лучшие Продукты Для Кожи!</p>
    <div class="footer__socials">
      <a href="#" target="_blank">✈️</a>
      <a href="#" target="_blank">💬</a>
    </div>
  </div>

  <form class="footer__form" id="subscribeForm">
    <label for="subscribeEmail">Подпишись на наши акции:</label>
    <div class="footer__input-group">
      <input 
        type="email" 
        id="subscribeEmail" 
        name="email" 
        placeholder="Введи Email..." 
        required
      >
      <button type="submit">Подписаться</button>
    </div>
  </form>

  <nav class="footer__nav">
    <h4>Быстрые ссылки</h4>
    <ul class="footer__list">
      <li><a href="#">Главная</a></li>
      <li><a href="#">Магазин</a></li>
      <li><a href="#">Контакты</a></li>
    </ul>
  </nav>
</footer>

<button id="openModalBtn">Регистрация</button>

<div class="overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal__close" id="closeModalBtn">&times;</button>
    <h2>Регистрация</h2>
    
    <form id="registerForm">
      <label>
        Имя: 
        <input type="text" name="firstName" required placeholder="Иван">
      </label>
      
      <label>
        Фамилия: 
        <input type="text" name="lastName" required placeholder="Иванов">
      </label>
      
      <label>
        Дата рождения: 
        <input type="date" name="birthDate" required>
      </label>
      
      <label>
        Логин: 
        <input type="text" name="login" required placeholder="user_123">
      </label>
      
      <label>
        Пароль: 
        <input type="password" name="password" id="password" required placeholder="••••••••">
      </label>
      
      <label>
        Повторите пароль: 
        <input type="password" name="confirmPassword" id="confirmPassword" required placeholder="••••••••">
      </label>
      
      <button type="submit">Зарегистрироваться</button>
    </form>
  </div>
</div>

  <script type="module" src="homework-10.js"></script>

  <script defer src="homework-11.js"></script>
</body>
</html>
