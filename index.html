<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>some products</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1 class="page-title">Выбери свой продукт</h1>

  <ul class="products-list" id="products-list"></ul>

  <template id="card-template">
    <li class="card">
      <img class="card__image" src="" alt="">
      <p class="card__skin-type card__skin-type--normal"></p>
      <h2 class="card__title"></h2>
      <p class="card__description"></p>
      <span class="card__subtitle">Состав:</span>
      <ul class="card__list"></ul>
      <div class="card__price-line">
        <span class="card__price-label">Цена</span>
        <span class="card__price-value"></span>
      </div>
    </li>
  </template>

  <script type="module" src="./homework-10.js"></script>
</body>
</html>
